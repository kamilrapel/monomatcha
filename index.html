<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MONO Matcha — Bangkok</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,425;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* MONO MATCHA — Bangkok */

:root {
  --c-bg: #ffffff;
  --c-surface-1: #f7f6f1;
  --c-surface-2: #ededea;
  --c-surface-3: #d8d6cf;
  --c-fg: #0b0b0b;
  --c-fg-muted: #4a4a4a;
  --c-fg-subtle: #7a7a7a;
  --c-border: #ededea;
  --c-border-strong: #d8d6cf;

  --matcha-100: #d4e8b4;
  --matcha-300: #a8d36b;
  --matcha-500: #7fb33a;
  --matcha-700: #4d7a1f;
  --matcha-900: #2a4810;
  --neon: #2ea800;
  --blue: #0052ef;

  --cream: #f1efe8;
  --cream-2: #e6e3d8;
  --paper: #faf9f5;
}

@supports (color: color(display-p3 1 1 1)) {
  :root { --neon: color(display-p3 0.18 0.66 0); }
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: var(--c-bg);
  color: var(--c-fg);
  font-family: "Inter Tight", ui-sans-serif, system-ui, sans-serif;
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
#smooth-wrapper { position: fixed; inset: 0; overflow: hidden; }
#smooth-content { will-change: transform; }
body { font-size: 16px; line-height: 1.5; }
::selection { background: #0b0b0b; color: #fff; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { text-decoration: none; color: inherit; }
ul { list-style: none; padding: 0; margin: 0; }
em.ital { font-family: "Inter Tight"; font-style: italic; font-weight: 400; }

.t-eyebrow {
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--c-fg-subtle);
  font-weight: 500;
}
.mono { font-family: "IBM Plex Mono", monospace; font-feature-settings: "tnum"; }
.container { max-width: 1440px; margin: 0 auto; padding: 0 32px; }

/* ============ TOP NAV ============ */
.topnav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 24px;
  padding: 14px 32px;
  background: rgba(255,255,255,0.78);
  backdrop-filter: saturate(140%) blur(16px);
  -webkit-backdrop-filter: saturate(140%) blur(16px);
  border-bottom: 1px solid rgba(0,0,0,0.06);
}
.topnav .brand {
  display: inline-flex; align-items: center; gap: 12px;
  cursor: pointer; color: var(--c-fg);
}
.topnav .brand:hover { color: var(--neon); }
.nav-items {
  display: flex; gap: 4px; justify-content: center;
}
.nav-link {
  display: inline-flex; align-items: baseline; gap: 8px;
  padding: 8px 14px; border-radius: 99999px;
  font-size: 14px; font-weight: 500; cursor: pointer;
  color: var(--c-fg-muted);
  transition: color 120ms ease, background 120ms ease;
}
.nav-link .nav-num {
  font-family: "IBM Plex Mono", monospace;
  font-size: 10px; color: var(--c-fg-subtle);
}
.nav-link:hover { color: var(--neon); }
.nav-link.is-active { background: #00533a; color: #ffffff; }
.nav-link.is-active:hover { background: #00533a; color: var(--neon); }
.nav-link.is-active .nav-num { color: rgba(255,255,255,0.6); }
.nav-cta { display: inline-flex; align-items: center; gap: 16px; }
.nav-eyebrow { font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--c-fg-subtle); }

/* ============ BUTTONS ============ */
.btn-pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 18px; border-radius: 99999px;
  background: #00533a; color: #ffffff;
  font-weight: 500; font-size: 14px;
  cursor: pointer;
  transition: background 120ms ease, color 120ms ease;
}
.btn-pill:hover { background: var(--neon); color: #fff; }
.btn-pill-lg { padding: 16px 26px; font-size: 16px; }
.btn-pill-nav {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 18px; border-radius: 99999px;
  background: #00533a; color: #ffffff;
  border: 1.5px solid #00533a;
  font-weight: 500; font-size: 14px;
  cursor: pointer;
  transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
}
.btn-pill-nav:hover { background: var(--neon); border-color: var(--neon); color: #ffffff; }
.btn-full { width: 100%; justify-content: center; }
.btn-ghost {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 16px 22px; border-radius: 99999px;
  border: 1px solid #00533a;
  color: #00533a; font-weight: 500; font-size: 14px;
  cursor: pointer;
  transition: border-color 120ms ease, color 120ms ease;
}
.btn-ghost:hover { border-color: var(--neon); color: var(--neon); }

/* ============ HERO ============ */
.hero {
  position: relative;
  padding: 120px 0 0;
  overflow: hidden;
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(46,168,0,0.10), transparent 60%),
    var(--c-bg);
}
.hero-grid {
  max-width: 1440px; margin: 0 auto;
  padding: 60px 32px 0;
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: 56px;
  align-items: center;
}
.hero-meta {
  display: flex; align-items: center; gap: 14px; margin-bottom: 28px;
}
.hero-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--c-fg-subtle); }
.hero-title {
  font-family: "Inter Tight", sans-serif;
  font-weight: 400;
  font-size: clamp(72px, 11vw, 156px);
  line-height: 0.92;
  letter-spacing: -0.055em;
  margin: 0 0 32px;
  display: flex; flex-direction: column;
}
.hero-word { display: block; color: #00533a; }
.hero-word-2 { padding-left: 1.2em; color: var(--c-fg-muted); }
.hero-em {
  font-style: italic;
  color: var(--neon);
  font-weight: 500;
}
.hero-lede {
  font-size: 19px; line-height: 1.5;
  color: #00533a;
  max-width: 560px; margin-bottom: 36px;
  text-wrap: pretty;
}
.hero-actions { display: flex; gap: 14px; flex-wrap: wrap; }

.hero-right {
  position: relative; align-self: stretch;
  display: flex; flex-direction: column; gap: 32px;
  align-items: center; justify-content: center;
  min-height: 540px;
}
.hero-bowl {
  position: relative; display: flex; align-items: center; justify-content: center;
  width: 460px; height: 480px;
  will-change: transform;
}
.hero-bowl svg {
  filter: drop-shadow(0 30px 60px rgba(46,168,0,0.18));
  animation: float 6s ease-in-out infinite;
}
@keyframes float { 50% { transform: translateY(-12px); } }
.hero-ripple {
  position: absolute; inset: -40px; border-radius: 50%;
  background: radial-gradient(circle at center, rgba(46,168,0,0.10), transparent 60%);
  z-index: -1;
}
.hero-stats {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 0;
  width: 100%; max-width: 460px;
  border-top: 1px solid var(--c-border-strong);
  padding-top: 20px;
}
.hero-stat { padding: 0 16px; border-left: 1px solid var(--c-border); }
.hero-stat:first-child { border-left: 0; padding-left: 0; }
.stat-num {
  font-family: "Inter Tight";
  font-size: 36px; line-height: 1;
  letter-spacing: -0.04em;
  color: var(--c-fg);
}
.stat-lbl {
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px; text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--c-fg-subtle);
  margin-top: 8px;
}

.ticker {
  margin-top: 80px;
  border-top: 1px solid var(--c-border);
  border-bottom: 1px solid var(--c-border);
  overflow: hidden;
  background: var(--c-surface-1);
}
.ticker-track {
  display: inline-flex; align-items: center;
  white-space: nowrap;
  animation: ticker 40s linear infinite;
  padding: 18px 0;
  font-family: "IBM Plex Mono", monospace;
  font-size: 12px; letter-spacing: 0.1em;
  color: var(--c-fg-muted);
}
.ticker-group { display: inline-flex; align-items: center; gap: 28px; padding-right: 28px; }
.ticker-dot {
  display: inline-block; width: 5px; height: 5px;
  background: var(--neon); border-radius: 50%;
}
@keyframes ticker { to { transform: translateX(-50%); } }

/* ============ Section heads / shared ============ */
.section-head {
  display: flex; flex-direction: column; gap: 16px;
  margin-bottom: 64px;
}
.section-title {
  font-family: "Inter Tight"; font-weight: 400;
  font-size: clamp(40px, 6vw, 84px);
  line-height: 1.0;
  letter-spacing: -0.04em;
  margin: 0;
}

/* ============ ABOUT ============ */
.about {
  background: #00533a;
  color: #ffffff;
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 90vh;
  overflow: hidden;
  border-top: 1px solid rgba(255,255,255,0.12);
  border-bottom: 1px solid rgba(255,255,255,0.12);
  padding: 0;
}
.about .section-title { color: #ffffff; }
.about .t-eyebrow { color: rgba(255,255,255,0.55); }
.about-panel-left {
  padding: 100px 72px;
  display: flex; flex-direction: column; gap: 56px;
  justify-content: center;
}
.about-panel-right {
  position: relative; overflow: hidden;
}
.about-panel-right img {
  width: 100%; height: 100%; object-fit: cover; object-position: center; display: block;
}
.about-panel-badge {
  position: absolute; bottom: 32px; left: 32px;
  background: #ffffff; color: #00533a;
  font-family: "IBM Plex Mono", monospace;
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase;
  padding: 10px 20px; border-radius: 100px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.18);
}
.about-grid {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 56px;
  margin-bottom: 100px;
}
.about-copy p { color: rgba(255,255,255,0.75); font-size: 17px; margin-bottom: 20px; }
.about-copy p.lead {
  font-size: 28px; line-height: 1.25;
  letter-spacing: -0.02em;
  color: #ffffff; margin-bottom: 28px;
  text-wrap: balance;
}
.about-side { display: flex; flex-direction: column; gap: 16px; }
.about-card {
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 12px;
  padding: 28px;
  color: #ffffff;
}
.about-card .about-row {
  display: flex; justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid rgba(255,255,255,0.14);
  font-size: 15px;
  color: rgba(255,255,255,0.75);
}
.about-card .about-row:last-child { border-bottom: 0; }
.about-card .about-row span:last-child { color: #ffffff; }
.about-card .t-eyebrow { display: block; margin-bottom: 8px; color: rgba(255,255,255,0.5); }
.about-card-dark {
  background: rgba(0,0,0,0.25);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.12);
}
.about-card-dark p { color: rgba(255,255,255,0.8); }
.about-pillars {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 0;
  border-top: 1px solid rgba(255,255,255,0.18);
}
.pillar {
  padding: 32px 24px 0 0;
  border-right: 1px solid rgba(255,255,255,0.18);
}
.pillar:last-child { border-right: 0; padding-right: 0; }
.pillar-num {
  font-family: "IBM Plex Mono", monospace;
  font-size: 12px;
  color: rgba(255,255,255,0.45);
  margin-bottom: 18px;
  letter-spacing: 0.08em;
}
.pillar h4 {
  font-family: "Inter Tight"; font-weight: 425;
  font-size: 24px; letter-spacing: -0.02em;
  margin-bottom: 12px; color: #ffffff;
}
.pillar p { font-size: 15px; color: rgba(255,255,255,0.65); }

/* ============ MENU ============ */
.menu { padding: 140px 0; background: var(--c-bg); }
.menu-tabs {
  display: flex; gap: 6px; align-items: center;
  border-bottom: 1px solid var(--c-border-strong);
  padding-bottom: 16px;
  margin-bottom: 24px;
}
.menu-tab {
  display: inline-flex; align-items: baseline; gap: 8px;
  padding: 10px 18px; border-radius: 99999px;
  background: var(--c-surface-2);
  color: var(--c-fg-muted);
  font-size: 15px; font-weight: 500;
  border: 1px solid transparent;
  cursor: pointer;
  transition: color 120ms ease, background 120ms ease, border-color 120ms ease;
}
.menu-tab:hover { color: var(--blue); }
.menu-tab.is-active {
  background: #0b0b0b; color: #ffffff;
}
.menu-tab.is-active .menu-tab-count { color: rgba(255,255,255,0.6); }
.menu-tab-count { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--c-fg-subtle); }
.menu-tabs-spacer { flex: 1; }
.menu-currency { color: var(--c-fg-subtle); }

.menu-list {
  border-top: 1px solid var(--c-border);
}
.menu-row {
  display: grid;
  grid-template-columns: 60px 220px 1fr 80px 90px 56px;
  gap: 24px;
  align-items: center;
  padding: 28px 8px;
  border-bottom: 1px solid var(--c-border);
  transition: background 120ms ease;
}
.menu-row:hover { background: rgba(0,0,0,0.01); }
.menu-row:hover .menu-add {
  background: var(--neon); color: #0b0b0b;
  border-color: var(--neon);
}
.menu-code {
  font-family: "IBM Plex Mono", monospace;
  font-size: 13px; color: var(--c-fg-subtle);
  letter-spacing: 0.08em;
}
.menu-name h3 {
  font-family: "Inter Tight"; font-weight: 425;
  font-size: 24px; letter-spacing: -0.025em;
  line-height: 1.1; margin: 0 0 4px;
}
.menu-sub {
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px; text-transform: uppercase;
  color: var(--matcha-700); letter-spacing: 0.06em;
}
.menu-desc {
  font-size: 15px; color: var(--c-fg-muted);
  margin: 0;
}
.menu-vol { font-size: 13px; color: var(--c-fg-subtle); text-align: right; }
.menu-price {
  font-family: "Inter Tight";
  font-size: 22px; letter-spacing: -0.02em;
  text-align: right; color: var(--c-fg);
}
.menu-add {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid var(--c-border-strong);
  font-size: 18px; line-height: 1;
  color: var(--c-fg-muted);
  transition: all 120ms ease;
  cursor: pointer;
}

.menu-foot {
  margin-top: 24px;
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 24px;
  padding-top: 16px;
  border-top: 1px solid var(--c-border);
}
.menu-foot-item p { color: var(--c-fg-muted); font-size: 15px; margin-top: 12px; max-width: 480px; }

/* ============ ORDER ============ */
.order {
  background: #00533a;
  color: #ffffff;
  padding: 140px 0;
  border-top: 1px solid rgba(255,255,255,0.12);
}
.order .section-title { color: #ffffff; }
.order .t-eyebrow { color: rgba(255,255,255,0.55); }
.order .menu-foot-item p { color: rgba(255,255,255,0.65); }
.order-grid {
  display: grid; grid-template-columns: 1.4fr 1fr;
  gap: 28px;
  align-items: start;
}
.order-builder {
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 12px;
  padding: 40px;
}
.builder-head { margin-bottom: 32px; }
.builder-head h3 {
  font-family: "Inter Tight"; font-weight: 425;
  font-size: 36px; letter-spacing: -0.03em;
  line-height: 1; margin: 0 0 8px;
}
.builder-sub {
  font-family: "IBM Plex Mono", monospace;
  font-size: 12px; text-transform: uppercase;
  letter-spacing: 0.06em; color: rgba(255,255,255,0.55);
}
.field { margin-bottom: 28px; }
.field > .t-eyebrow { display: block; margin-bottom: 12px; }
.field-row {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 24px; align-items: end;
}
.seg {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.seg-4 { grid-template-columns: repeat(4, 1fr); }
.seg-btn {
  display: flex; flex-direction: column; gap: 6px;
  padding: 14px 16px;
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 6px;
  background: transparent;
  color: rgba(255,255,255,0.85);
  text-align: left;
  transition: all 120ms ease;
}
.seg-btn:hover { border-color: rgba(255,255,255,0.6); color: #ffffff; }
.seg-btn.is-on {
  background: #ffffff;
  color: #00533a;
  border-color: #ffffff;
}
.seg-label { font-size: 15px; font-weight: 500; }
.seg-meta {
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px; opacity: 0.7;
}
.checks { display: flex; flex-direction: column; gap: 8px; }
.check {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 14px; align-items: center;
  padding: 14px 16px;
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 6px;
  cursor: pointer;
  transition: all 120ms ease;
  color: rgba(255,255,255,0.85);
}
.check:hover { border-color: rgba(255,255,255,0.6); }
.check input { display: none; }
.check-box {
  width: 18px; height: 18px;
  border: 1px solid rgba(255,255,255,0.4);
  border-radius: 3px;
  position: relative;
}
.check.is-on .check-box {
  background: #ffffff; border-color: #ffffff;
}
.check.is-on .check-box::after {
  content: ''; position: absolute;
  inset: 4px; background: #ffffff;
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='4'><polyline points='20 6 9 17 4 12'/></svg>") center / contain no-repeat;
          mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='4'><polyline points='20 6 9 17 4 12'/></svg>") center / contain no-repeat;
}
.check-label { font-size: 15px; }
.check-meta {
  font-family: "IBM Plex Mono", monospace;
  font-size: 12px; color: rgba(255,255,255,0.5);
}
.qty {
  display: inline-flex; align-items: center;
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 99999px;
  margin-top: 12px;
}
.qty button { width: 44px; height: 44px; font-size: 20px; color: rgba(255,255,255,0.85); }
.qty button:hover { color: #ffffff; }
.qty-num {
  min-width: 40px; text-align: center;
  font-family: "Inter Tight"; font-size: 20px;
  color: #ffffff;
}
.pickup { display: flex; flex-direction: column; }
.pickup-time { margin-top: 12px; padding: 12px 16px; background: rgba(255,255,255,0.1); border-radius: 6px; }
.pickup-now { display: block; font-size: 16px; color: #a8d36b; font-weight: 500; }
.pickup-meta { display: block; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 2px; }

.order-receipt {
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 12px;
  padding: 32px;
  position: sticky; top: 96px;
  color: #ffffff;
}
.receipt-head {
  display: flex; justify-content: space-between; align-items: baseline;
  padding-bottom: 16px;
  margin-bottom: 16px;
  border-bottom: 1px dashed rgba(255,255,255,0.2);
}
.receipt-id { color: rgba(255,255,255,0.5); font-size: 12px; }
.receipt-line {
  display: flex; justify-content: space-between;
  padding: 8px 0;
  font-size: 15px;
}
.receipt-line.muted { color: rgba(255,255,255,0.55); font-size: 14px; }
.receipt-divider {
  height: 0; border-top: 1px dashed rgba(255,255,255,0.2);
  margin: 12px 0;
}
.receipt-total {
  display: flex; justify-content: space-between; align-items: baseline;
  padding-bottom: 24px;
  font-size: 16px;
}
.receipt-total-num {
  font-family: "Inter Tight";
  font-size: 32px; letter-spacing: -0.03em;
  color: #ffffff;
}
.receipt-or {
  display: flex; align-items: center; gap: 12px;
  margin: 16px 0;
  color: rgba(255,255,255,0.45);
  font-family: "IBM Plex Mono", monospace; font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.1em;
}
.receipt-or::before, .receipt-or::after {
  content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.2);
}
.receipt-meta {
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px dashed rgba(255,255,255,0.2);
  display: flex; flex-direction: column; gap: 8px;
}
.receipt-meta li {
  display: flex; justify-content: space-between;
  font-size: 13px; color: rgba(255,255,255,0.65);
}

.order-channels {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-top: 56px;
}
.channel {
  display: block;
  padding: 24px;
  border: 1px solid rgba(255,255,255,0.22);
  border-radius: 12px;
  cursor: pointer;
  transition: all 120ms ease;
  color: #ffffff;
}
.channel:hover { border-color: rgba(255,255,255,0.55); background: rgba(255,255,255,0.08); }
.channel:hover .channel-name { color: #ffffff; }
.channel-name {
  font-family: "Inter Tight"; font-weight: 425;
  font-size: 22px; letter-spacing: -0.025em;
  margin-bottom: 6px;
  display: flex; justify-content: space-between;
  color: #ffffff;
}
.channel-arr { color: rgba(255,255,255,0.45); }
.channel-handle { font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 12px; }
.channel-label { color: rgba(255,255,255,0.45); }

/* ============ LOCATION ============ */
.location { padding: 140px 0 0; background: var(--c-bg); border-top: 1px solid var(--c-border); }
.loc-grid {
  display: grid; grid-template-columns: 1.2fr 1fr;
  gap: 32px;
  margin-bottom: 100px;
}
.map-frame {
  position: relative;
  border-radius: 12px; overflow: hidden;
  border: 1px solid var(--c-border-strong);
  aspect-ratio: 16 / 10;
  background: #f7f6f1;
}
.map-frame iframe { width: 100%; height: 100%; position: absolute; inset: 0; }
.map-controls {
  position: absolute; top: 16px; right: 16px;
  display: flex; flex-direction: column; gap: 4px;
}
.map-controls button {
  width: 36px; height: 36px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(8px);
  border: 1px solid var(--c-border-strong);
  border-radius: 4px;
  color: var(--c-fg); font-size: 16px;
}
.map-controls button:hover { color: var(--blue); border-color: var(--blue); }
.map-key {
  position: absolute; bottom: 16px; left: 16px;
  display: inline-flex; align-items: center; gap: 10px;
  padding: 8px 14px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(8px);
  border: 1px solid var(--c-border-strong);
  border-radius: 99999px;
  font-size: 11px; color: var(--c-fg-muted);
}
.map-key-dot { width: 8px; height: 8px; background: var(--neon); border-radius: 50%; box-shadow: 0 0 0 4px rgba(46,168,0,0.18); }

.loc-info { display: flex; flex-direction: column; gap: 16px; }
.loc-card {
  background: var(--c-surface-1);
  border: 1px solid var(--c-border);
  border-radius: 12px;
  padding: 32px;
}
.loc-card-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 24px;
}
.loc-card-head h3 {
  font-family: "Inter Tight"; font-weight: 425;
  font-size: 32px; letter-spacing: -0.03em;
  margin: 0;
}
.open-pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px; border-radius: 99999px;
  background: rgba(46,168,0,0.12);
  color: var(--neon);
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
}
.open-pill i {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--neon);
  box-shadow: 0 0 0 3px rgba(46,168,0,0.25);
  animation: pulse 2s ease-in-out infinite;
  font-style: normal;
  display: inline-block;
}
@keyframes pulse { 50% { opacity: 0.5; } }
.loc-row { margin-bottom: 24px; }
.loc-row .t-eyebrow { display: block; margin-bottom: 8px; }
.loc-row p { color: var(--c-fg); font-size: 16px; line-height: 1.5; }
.loc-row-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 32px;
  padding-top: 16px;
  border-top: 1px solid var(--c-border);
}
.loc-row-grid .t-eyebrow { display: block; margin-bottom: 12px; }
.hours { display: flex; flex-direction: column; gap: 8px; }
.hours li {
  display: flex; justify-content: space-between;
  font-size: 14px; color: var(--c-fg-muted);
}
.hours li span:last-child { color: var(--c-fg); }

.loc-transit {
  background: var(--c-surface-1);
  border: 1px solid var(--c-border);
  border-radius: 12px;
  padding: 28px 32px;
}
.loc-transit > .t-eyebrow { display: block; margin-bottom: 16px; }
.transit { display: flex; flex-direction: column; gap: 0; }
.transit li {
  display: grid;
  grid-template-columns: 64px 1fr auto;
  gap: 16px; align-items: center;
  padding: 16px 0;
  border-top: 1px solid var(--c-border);
}
.transit li:first-child { border-top: 0; padding-top: 0; }
.transit li:last-child { padding-bottom: 0; }
.transit-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 56px; height: 32px;
  background: var(--c-surface-2);
  color: var(--c-fg);
  border-radius: 4px;
  font-family: "IBM Plex Mono", monospace;
  font-size: 12px; font-weight: 500;
  letter-spacing: 0.06em;
}
.transit li > div { display: flex; flex-direction: column; gap: 2px; }
.transit strong {
  font-family: "Inter Tight"; font-weight: 500;
  font-size: 16px;
}
.transit span { color: var(--c-fg-muted); font-size: 13px; }

/* ============ FOOTER ============ */
.footer {
  padding: 80px 0 32px;
  border-top: 1px solid var(--c-border);
  background: var(--c-bg);
}
.footer-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr;
  gap: 48px;
  padding-bottom: 56px;
  border-bottom: 1px solid var(--c-border);
}
.footer-mark { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
.footer-brand p { color: var(--c-fg-muted); font-size: 15px; max-width: 320px; }
.footer-col .t-eyebrow { display: block; margin-bottom: 16px; color: var(--c-fg); }
.footer-col ul { display: flex; flex-direction: column; gap: 8px; }
.footer-col li { color: var(--c-fg-muted); font-size: 14px; cursor: pointer; transition: color 120ms ease; }
.footer-col li:hover { color: var(--blue); }
.footer-bottom {
  display: flex; justify-content: space-between;
  padding-top: 24px;
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px; color: var(--c-fg-subtle);
  letter-spacing: 0.08em;
}

/* ============ Responsive ============ */
/* ============ HAMBURGER ============ */
.nav-burger {
  display: none;
  flex-direction: column; gap: 5px;
  cursor: pointer; padding: 4px;
  background: none; border: 0;
}
.nav-burger span {
  display: block; width: 22px; height: 2px;
  background: #00533a; border-radius: 2px;
  transition: all 200ms ease;
}
.nav-mobile-menu {
  display: none;
  position: fixed; inset: 0; z-index: 49;
  background: rgba(255,255,255,0.97);
  backdrop-filter: blur(16px);
  flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px;
}
.nav-mobile-menu.is-open { display: flex; }
.nav-mobile-link {
  display: grid;
  grid-template-columns: 60px 1fr 60px;
  align-items: center;
  width: 100%;
  max-width: 340px;
  font-size: 28px; font-weight: 500;
  letter-spacing: -0.02em;
  color: #00533a;
  padding: 12px 0;
  cursor: pointer;
  text-transform: uppercase;
}
.nav-mobile-link .nav-mobile-num {
  font-family: "IBM Plex Mono", monospace;
  font-size: 13px;
  color: rgba(0,83,58,0.4);
  justify-self: start;
}
.nav-mobile-link .nav-mobile-label {
  text-align: center;
}
.nav-mobile-link:hover { color: var(--neon); }
.nav-mobile-link:hover .nav-mobile-num { color: var(--neon); opacity: 0.5; }

@media (max-width: 960px) {
  /* smooth wrapper — normalny scroll na mobile */
  #smooth-wrapper { position: static; overflow: visible; }
  #smooth-content { will-change: auto; }

  /* NAV: logo | hamburger (środek) | Order Now (prawo) */
  .topnav { grid-template-columns: auto 1fr auto; padding: 12px 20px; }
  .nav-items { display: none; }
  .nav-cta { display: contents; }
  .nav-cta .nav-eyebrow { display: none; }
  .nav-burger { display: flex; grid-column: 2; justify-self: center; align-self: center; }
  .btn-pill-nav { grid-column: 3; align-self: center; }

  /* HERO */
  .hero-grid { grid-template-columns: 1fr; gap: 32px; padding: 40px 20px 0; }
  .hero-right { min-height: 280px; }
  .hero-bowl { width: 260px; height: 280px; }

  /* ABOUT */
  .about { grid-template-columns: 1fr; min-height: auto; }
  .about-panel-left { padding: 64px 24px; gap: 40px; }
  .about-panel-right { height: 60vw; min-height: 280px; }
  .about-pillars { grid-template-columns: 1fr 1fr; }
  .pillar { border-right: 0; padding-right: 0; }

  /* MENU */
  .menu-foot, .loc-grid, .loc-row-grid { grid-template-columns: 1fr; }
  .menu-row {
    grid-template-columns: 40px 1fr auto;
    grid-template-areas: "code name price" "code desc desc" "code vol add";
    gap: 8px 12px;
  }
  .menu-code { grid-area: code; }
  .menu-name { grid-area: name; }
  .menu-desc { grid-area: desc; font-size: 13px; }
  .menu-vol { grid-area: vol; text-align: left; }
  .menu-price { grid-area: price; }
  .menu-add { grid-area: add; }

  /* ORDER */
  .order-grid { grid-template-columns: 1fr; }
  .seg-4 { grid-template-columns: 1fr 1fr; }
  .order-channels { grid-template-columns: 1fr 1fr; }
  .order-receipt { position: static; }

  /* FOOTER */
  .footer-grid { grid-template-columns: 1fr 1fr; }
  .footer-bottom { flex-direction: column; gap: 8px; }

  /* CONTAINER */
  .container { padding: 0 20px; }
  .menu { padding: 80px 0; }
  .order { padding: 80px 0; }
  .location { padding: 80px 0 0; }
}
</style>
</head>

// ================= TOP NAV =================
const TopNav = ({ active, setActive }) => {
  const [menuOpen, setMenuOpen] = React.useState(false);
  const items = [
    { id: 'home', label: 'Home' },
    { id: 'about', label: 'About' },
    { id: 'menu', label: 'Menu' },
    { id: 'order', label: 'Order' },
    { id: 'location', label: 'Location' },
  ];
  const go = (id) => {
    setActive(id);
    setMenuOpen(false);
    const el = document.getElementById(id);
    if (!el) return;
    if (window.__smoother) {
      window.__smoother.scrollTo(el, true, 'top top');
    } else {
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  };
  return (
    <>
      <nav className="topnav">
        <a className="brand" onClick={() => go('home')}>
          <Wordmark height={31} />
        </a>
        <ul className="nav-items">
          {items.map((it, idx) => (
            <li key={it.id}>
              <a
                className={'nav-link' + (active === it.id ? ' is-active' : '')}
                onClick={() => go(it.id)}
              >
                <span className="nav-label" style={{ textTransform: 'uppercase' }}>{it.label}</span>
                <span className="nav-num">/{String(idx + 1).padStart(2, '0')}</span>
              </a>
            </li>
          ))}
        </ul>
        <div className="nav-cta">
          <span className="nav-eyebrow">BKK · 26°C</span>

<script>
  window.addEventListener('load', () => {
    const isMobile = window.innerWidth <= 960;

    if (!isMobile && window.ScrollSmoother && window.gsap) {
      const init = () => {
        gsap.registerPlugin(ScrollTrigger, ScrollSmoother);
        window.__smoother = ScrollSmoother.create({
          wrapper: '#smooth-wrapper',
          content: '#smooth-content',
          smooth: 1.4,
          effects: true,
          normalizeScroll: true,
          smoothTouch: 0,
        });

        const sections = ['home','about','menu','order','location'];
        sections.forEach(id => {
          const el = document.getElementById(id);
          if (!el) return;
          ScrollTrigger.create({
            trigger: el,
            start: 'top 40%',
            onEnter: () => { if (window.__setActiveNav) window.__setActiveNav(id); },
            onEnterBack: () => { if (window.__setActiveNav) window.__setActiveNav(id); },
          });
        });
      };
      requestAnimationFrame(() => requestAnimationFrame(init));
    } else if (isMobile && window.gsap) {
      // Na mobile — tylko ScrollTrigger do podświetlania nav, bez smoothera
      gsap.registerPlugin(ScrollTrigger);
      const sections = ['home','about','menu','order','location'];
      sections.forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        ScrollTrigger.create({
          trigger: el,
          start: 'top 40%',
          onEnter: () => { if (window.__setActiveNav) window.__setActiveNav(id); },
          onEnterBack: () => { if (window.__setActiveNav) window.__setActiveNav(id); },
        });
      });
    }
  });
</script>
